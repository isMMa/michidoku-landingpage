<!doctype html>
<html lang="es" data-theme="noche">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Michidoku</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/michidoku-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () { try { var t = localStorage.getItem('michidoku-theme'); if (t === 'claro' || t === 'noche') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
  </script>
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .notfound { flex: 1; display: grid; place-items: center; padding: calc(var(--header-h) + 40px) 16px 70px; text-align: center; }
    .notfound-card { max-width: 620px; }
    .notfound-cat { width: min(62%, 260px); margin: 0 auto 6px; filter: drop-shadow(0 24px 20px rgba(0,0,0,.3)); }
    .notfound-cat .cat-svg { width: 100%; height: auto; }
    .notfound-code { font-family: var(--font-display); font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
    .notfound h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); margin: 14px 0 14px; }
    .notfound p { color: var(--muted); margin-bottom: 26px; }
    .notfound-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  </style>
</head>
<body>
  <header class="site-header is-scrolled">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Michidoku, volver a la web">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M12 29c0-7 5.4-12 12-12s12 5 12 12-5.4 11-12 11-12-4-12-11Z" fill="#3A2114"/><path d="M12 21 9 8l10 6M36 21l3-13-10 6" fill="#3A2114"/><path d="M12 21 10 12l7 4M36 21l2-9-7 4" fill="#F08A9B"/><ellipse cx="19" cy="28" rx="2.4" ry="2.8" fill="#FFF6E6"/><ellipse cx="29" cy="28" rx="2.4" ry="2.8" fill="#FFF6E6"/><path d="M24 31.5 21.8 34h4.4L24 31.5Z" fill="#F08A9B"/><path d="M24 34v2m0 0c-1.5 1.6-3.4 1.3-4.2.4M24 36c1.5 1.6 3.4 1.3 4.2.4" fill="none" stroke="#FFF6E6" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span>Michidoku</span>
      </a>
    </div>
  </header>

  <main class="notfound">
    <div class="notfound-card">
      <div class="notfound-cat" id="nf-cat" aria-hidden="true"></div>
      <span class="notfound-code">Error 404 · Pista no encontrada</span>
      <h1>Esta página se perdió<br>como un ovillo</h1>
      <p>El rastro termina aquí. Puede que el enlace esté roto o que este michi haya escondido la página en otra habitación.</p>
      <div class="notfound-actions">
        <a class="btn" href="/">
          <svg aria-hidden="true"><use href="#i-paw"/></svg>
          Volver a la casa
        </a>
        <a class="btn btn--ghost" href="/#michis">
          <svg aria-hidden="true"><use href="#i-sparkle"/></svg>
          Generar un michi
        </a>
      </div>
    </div>
  </main>

  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-paw" viewBox="0 0 24 24"><ellipse cx="12" cy="16.2" rx="5.1" ry="4.3" fill="currentColor"/><ellipse cx="5.3" cy="10.6" rx="2.35" ry="3" fill="currentColor" transform="rotate(-20 5.3 10.6)"/><ellipse cx="9.4" cy="6.6" rx="2.2" ry="2.9" fill="currentColor"/><ellipse cx="14.6" cy="6.6" rx="2.2" ry="2.9" fill="currentColor"/><ellipse cx="18.7" cy="10.6" rx="2.35" ry="3" fill="currentColor" transform="rotate(20 18.7 10.6)"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2.5 14.2 9.8 21.5 12l-7.3 2.2L12 21.5l-2.2-7.3L2.5 12l7.3-2.2L12 2.5Z" fill="currentColor"/></symbol>
  </svg>

  <script src="/cats.js"></script>
  <script>
    (function () {
      var host = document.getElementById('nf-cat');
      if (!host || !window.MichidokuCats) return;
      host.innerHTML = window.MichidokuCats.renderCat({ name: 'Trufa', color: 'siames', size: 320, label: 'Michi detective' });
    })();
  </script>
</body>
</html>
